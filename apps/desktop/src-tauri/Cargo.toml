[package]
name = "ssh-forward-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
ssh-forward-config = { path = "../../../crates/ssh-forward-config" }
ssh-forward-core = { path = "../../../crates/ssh-forward-core" }
ssh-forward-ssh = { path = "../../../crates/ssh-forward-ssh" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Win32_UI_Shell 提供 ShellExecuteW（E1：替代 `cmd /C start`，消除 shell 解析层）；
# Win32_UI_WindowsAndMessaging 提供 SW_SHOWNORMAL。二者缺一即编译失败。
windows-sys = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
