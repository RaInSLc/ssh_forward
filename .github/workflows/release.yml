name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            bundle: msi nsis
          - os: macos-15-intel
            artifact: macos-x64
            bundle: dmg
          - os: macos-14
            artifact: macos-aarch64
            bundle: dmg
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Rust Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Verify frontend
        working-directory: apps/desktop
        run: |
          npm run check
          npm run build

      - name: Build desktop bundles
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Create Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          Compress-Archive -Path target/release/ssh-forward-desktop.exe -DestinationPath "target/release/bundle/ssh-forward_${version}_x64-portable.zip"

      - name: Create macOS portable archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          app_path="$(find target/release/bundle -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          echo "Creating portable archive from: $app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "target/release/bundle/ssh-forward_${version}_${{ matrix.artifact }}-portable.zip"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/*-portable.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-assets/*
