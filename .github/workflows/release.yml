name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            bundle: msi nsis
          - os: macos-15-intel
            artifact: macos-x64
            bundle: app dmg
          - os: macos-14
            artifact: macos-aarch64
            bundle: app dmg
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Rust Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Verify frontend
        working-directory: apps/desktop
        run: |
          npm run check
          npm run build

      - name: Build desktop bundles
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Create Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          Compress-Archive -Path target/release/ssh-forward-desktop.exe -DestinationPath "target/release/bundle/ssh-forward_${version}_x64-portable.zip"

      - name: Stage Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path target/release/bundle -Recurse -Include *.msi, *-setup.exe, *-portable.zip, *.sig, *.nsis.zip | Copy-Item -Destination release-assets/

      - name: Create macOS portable archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          app_path="$(find target/release/bundle -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          echo "Creating portable archive from: $app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "target/release/bundle/ssh-forward_${version}_${{ matrix.artifact }}-portable.zip"

      - name: Stage macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*-portable.zip' -o -name '*.sig' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -type f -name '*-portable.zip' -print -quit)"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json updater metadata
        shell: bash
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const tag = process.env.RELEASE_TAG || '';
          const version = tag.replace(/^v/, '');
          const assetsDir = path.resolve('release-assets');
          const files = fs.readdirSync(assetsDir);
          
          const repo = process.env.GITHUB_REPOSITORY || 'RaInSLc/ssh_forward';
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;

          const manifest = {
            version: tag,
            notes: `Release ${tag}`,
            pub_date: new Date().toISOString(),
            platforms: {}
          };

          for (const file of files) {
            if (file.endsWith('.sig')) {
              const targetName = file.slice(0, -4);
              if (files.includes(targetName)) {
                const sigContent = fs.readFileSync(path.join(assetsDir, file), 'utf8').trim();
                const assetUrl = `${baseUrl}/${targetName}`;
                
                if (targetName.includes('x64') || targetName.includes('x86_64')) {
                  if (targetName.endsWith('.exe') || targetName.endsWith('.zip') || targetName.endsWith('.msi')) {
                    manifest.platforms['windows-x86_64'] = {
                      signature: sigContent,
                      url: assetUrl
                    };
                  }
                  if (targetName.includes('macos') || targetName.endsWith('.dmg') || targetName.endsWith('.tar.gz')) {
                    manifest.platforms['darwin-x86_64'] = {
                      signature: sigContent,
                      url: assetUrl
                    };
                  }
                }
                if (targetName.includes('aarch64') || targetName.includes('arm64')) {
                  manifest.platforms['darwin-aarch64'] = {
                    signature: sigContent,
                    url: assetUrl
                  };
                }
              }
            }
          }

          console.log('Generated updater manifest:', JSON.stringify(manifest, null, 2));
          fs.writeFileSync(path.join(assetsDir, 'latest.json'), JSON.stringify(manifest, null, 2), 'utf8');
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-assets/*
